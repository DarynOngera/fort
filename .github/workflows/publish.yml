name: Publish to Hex

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: hex-publish

    env:
      MIX_ENV: test
      FORT_DB_HOST: localhost
      FORT_DB_USERNAME: postgres
      FORT_DB_PASSWORD: postgres
      FORT_DB_DATABASE: fort_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Verify tag matches mix.exs version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MIX_VERSION=$(mix run -e 'IO.puts(Mix.Project.config()[:version])')
          if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
            echo "Tag v$TAG_VERSION doesn't match mix.exs version $MIX_VERSION"
            exit 1
          fi

      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
