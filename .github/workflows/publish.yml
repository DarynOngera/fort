name: Publish to Hex

on:
  push:
    tags:
      - "v*"

env:
  FORT_DB_HOST: localhost
  FORT_DB_USERNAME: postgres
  FORT_DB_PASSWORD: postgres
  FORT_DB_DATABASE: fort_test

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          MIX_ENV: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile and run tests
        run: |
          mix compile --warnings-as-errors
          mix test

      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
